<svg xmlns="http://www.w3.org/2000/svg" width="390" height="300" viewBox="0 0 390 300" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1A14"/>
      <stop offset="0.62" stop-color="#15120E"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0C060" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#C9A227" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9DFC8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E9DFC8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9DFC8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0E0C0A" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="390" height="300" fill="url(#sky)"/>
  <circle cx="292" cy="74" r="86" fill="url(#moon)"/>
  <circle cx="292" cy="74" r="31" fill="#E9DFC8" opacity="0.16"/>
  <g filter="url(#rough)">
    <path d="M0 196 L38 158 L66 178 L104 132 L140 170 L176 150 L214 184 L250 148 L286 180 L326 152 L360 176 L390 160 L390 300 L0 300 Z" fill="url(#far)"/>
    <path d="M0 236 L42 202 L78 224 L118 186 L158 220 L196 198 L236 232 L276 200 L316 226 L356 206 L390 222 L390 300 L0 300 Z" fill="url(#mid)" opacity="0.9"/>
    <path d="M0 276 L52 248 L96 264 L142 238 L196 268 L246 246 L298 270 L342 252 L390 268 L390 300 L0 300 Z" fill="#080706" opacity="0.92"/>
  </g>
  <ellipse cx="120" cy="222" rx="150" ry="17" fill="#E9DFC8" opacity="0.07" filter="url(#mist)"/>
  <ellipse cx="300" cy="258" rx="170" ry="20" fill="#E9DFC8" opacity="0.05" filter="url(#mist)"/>
  <rect width="390" height="300" filter="url(#grain)" opacity="0.5"/>
</svg>
