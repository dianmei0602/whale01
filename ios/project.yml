name: Jinri
options:
  bundleIdPrefix: com.jinri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.5.0

targets:

  # ───────────── 主 App ─────────────
  Jinri:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - target: JinriWidgets
      - package: Lottie
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nomi
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "20"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.jinri.app
            CFBundleURLSchemes:
              - nomi
        LSApplicationQueriesSchemes:
          - iosamap
          - amapuri
        NSMicrophoneUsageDescription: 按住说话时要录音，只用于把你说的转成文字。
        NSSpeechRecognitionUsageDescription: 把你说的话转成文字，好回答你。
        UIBackgroundModes:
          - audio
        NSLocationWhenInUseUsageDescription: 用当前位置看天气。不给也行，用设置里填的城市。
        NSCalendarsFullAccessUsageDescription: 读你今天的日程，好告诉你下一个会几点。
        NSRemindersFullAccessUsageDescription: 读你没完成的待办，好提醒你今天要交什么。
        NSMotionUsageDescription: 读今天的步数，用来看你有没有动起来。
        NSCameraUsageDescription: 打开「跟着你看」时用前置摄像头找你的脸，画面不保存、不上传。
        NSAppleMusicUsageDescription: 读取 iPhone「音乐」资料库，用于在 Nomi 里选择和播放歌曲。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinri.app
        PRODUCT_NAME: Jinri
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # ───────────── Widget Extension（灵动岛 / 锁屏）─────────────
  JinriWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/WidgetExt
      - path: App/Sources/Widget
      - path: App/Sources/Models/PetMood.swift
      - path: App/Sources/Core/PetLifecycle.swift
      - path: App/Sources/Core/PetMotionEngine.swift
      - path: App/Sources/Core/WidgetSnapshot.swift
      - path: App/Sources/Models/Weather.swift
      - path: App/Sources/Services/WeatherService.swift
    info:
      path: App/WidgetExt/Info.plist
      properties:
        CFBundleDisplayName: Nomi
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "20"
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: 小组件要显示你所在城市的天气
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinri.app.widgets
        PRODUCT_NAME: JinriWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Jinri:
    build:
      targets:
        Jinri: all
    run:
      config: Debug
    archive:
      config: Release
