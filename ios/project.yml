name: WhaleAgent
options:
  bundleIdPrefix: com.whale01
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ExyteChat:
    url: https://github.com/exyte/Chat
    exactVersion: 3.3.7
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    COMPRESS_PNG_FILES: NO
    CURRENT_PROJECT_VERSION: "204"
    MARKETING_VERSION: "2.0.4"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  WhaleAgent:
    type: application
    platform: iOS
    sources:
      - path: WhaleAgent
        excludes:
          - "Info.plist"
          - "WhaleAgent.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.agent
        PRODUCT_NAME: WhaleAgent
        INFOPLIST_FILE: WhaleAgent/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhaleAgent/WhaleAgent.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: EventKit.framework
      - sdk: HealthKit.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: Contacts.framework
      - sdk: MessageUI.framework
      - sdk: MediaPlayer.framework
      - sdk: MusicKit.framework
      - sdk: Speech.framework
      - sdk: Vision.framework
      - sdk: PDFKit.framework
      - sdk: PhotosUI.framework
      - package: ExyteChat
        product: ExyteChat
      - target: WhaleAgentShare
        embed: true
      - target: WhaleAgentWidgets
        embed: true
  WhaleAgentSideload:
    type: application
    platform: iOS
    sources:
      - path: WhaleAgent
        excludes:
          - "Info.plist"
          - "WhaleAgent.entitlements"
          - "WhaleAgent-Sideload.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.whaleagent.alt
        PRODUCT_NAME: WhaleAgent
        INFOPLIST_FILE: WhaleAgent/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhaleAgent/WhaleAgent-Sideload.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FREE_SIGNING"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: EventKit.framework
      - sdk: HealthKit.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: Contacts.framework
      - sdk: MessageUI.framework
      - sdk: MediaPlayer.framework
      - sdk: MusicKit.framework
      - sdk: Speech.framework
      - sdk: Vision.framework
      - sdk: PDFKit.framework
      - sdk: PhotosUI.framework
      - package: ExyteChat
        product: ExyteChat
      - target: WhaleAgentShareSideload
        embed: true
      - target: WhaleAgentWidgetsSideload
        embed: true
  WhaleAgentShare:
    type: app-extension
    platform: iOS
    sources:
      - path: WhaleAgentShare
        excludes:
          - "Info.plist"
          - "WhaleAgentShare.entitlements"
          - "WhaleAgentShareSideload.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.agent.share
        PRODUCT_NAME: WhaleAgentShare
        INFOPLIST_FILE: WhaleAgentShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhaleAgentShare/WhaleAgentShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
  WhaleAgentShareSideload:
    type: app-extension
    platform: iOS
    sources:
      - path: WhaleAgentShare
        excludes:
          - "Info.plist"
          - "WhaleAgentShare.entitlements"
          - "WhaleAgentShareSideload.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.whaleagent.alt.share
        PRODUCT_NAME: WhaleAgentShare
        INFOPLIST_FILE: WhaleAgentShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhaleAgentShare/WhaleAgentShareSideload.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FREE_SIGNING"
        APPLICATION_EXTENSION_API_ONLY: YES
  WhaleAgentWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WhaleAgentWidgets
        excludes:
          - "Info.plist"
          - "WhaleAgentWidgets.entitlements"
      - path: Shared
      - path: WhaleAgent/Models/DailyQuote.swift
      - path: WhaleAgent/Models/DailyQuoteCorpus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.agent.widgets
        PRODUCT_NAME: WhaleAgentWidgets
        INFOPLIST_FILE: WhaleAgentWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhaleAgentWidgets/WhaleAgentWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  WhaleAgentWidgetsSideload:
    type: app-extension
    platform: iOS
    sources:
      - path: WhaleAgentWidgets
        excludes:
          - "Info.plist"
          - "WhaleAgentWidgets.entitlements"
      - path: Shared
      - path: WhaleAgent/Models/DailyQuote.swift
      - path: WhaleAgent/Models/DailyQuoteCorpus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.whaleagent.alt.widgets
        PRODUCT_NAME: WhaleAgentWidgets
        INFOPLIST_FILE: WhaleAgentWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FREE_SIGNING"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  WhaleAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhaleAgentTests
    dependencies:
      - target: WhaleAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.agent.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: WhaleAgent
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WhaleAgent.app/WhaleAgent"
        BUNDLE_LOADER: "$(TEST_HOST)"
  WhaleAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WhaleAgentUITests
    dependencies:
      - target: WhaleAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whale01.agent.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WhaleAgent
schemes:
  WhaleAgentInteractions:
    build:
      targets:
        WhaleAgent: all
        WhaleAgentUITests: [test]
    test:
      config: Debug
      targets:
        - WhaleAgentUITests
  WhaleAgent:
    build:
      targets:
        WhaleAgent: all
        WhaleAgentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhaleAgentTests
    archive:
      config: Release
  WhaleAgentSideload:
    build:
      targets:
        WhaleAgentSideload: all
    run:
      config: Debug
    archive:
      config: Release
