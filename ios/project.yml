name: ChineseChronicles
options:
  bundleIdPrefix: com.chinesechronicles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    COMPRESS_PNG_FILES: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  ChineseChronicles:
    type: application
    platform: iOS
    sources:
      - path: ChineseChronicles
        excludes:
          - "Info.plist"
          - "ChineseChronicles.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chinesechronicles.app
        PRODUCT_NAME: ChineseChronicles
        INFOPLIST_FILE: ChineseChronicles/Info.plist
        CODE_SIGN_ENTITLEMENTS: ChineseChronicles/ChineseChronicles.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  # A second app target with a different bundle id, so the sideload build can be
  # installed next to a store/TestFlight build without overwriting it.
  ChineseChroniclesSideload:
    type: application
    platform: iOS
    sources:
      - path: ChineseChronicles
        excludes:
          - "Info.plist"
          - "ChineseChronicles.entitlements"
          - "ChineseChronicles-Sideload.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chinesechronicles.alt
        PRODUCT_NAME: ChineseChronicles
        INFOPLIST_FILE: ChineseChronicles/Info.plist
        CODE_SIGN_ENTITLEMENTS: ChineseChronicles/ChineseChronicles-Sideload.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FREE_SIGNING"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  ChineseChroniclesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChineseChroniclesTests
    dependencies:
      - target: ChineseChronicles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chinesechronicles.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: ChineseChronicles
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChineseChronicles.app/ChineseChronicles"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ChineseChroniclesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChineseChroniclesUITests
    dependencies:
      - target: ChineseChronicles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chinesechronicles.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChineseChronicles
schemes:
  ChineseChroniclesInteractions:
    build:
      targets:
        ChineseChronicles: all
        ChineseChroniclesUITests: [test]
    test:
      config: Debug
      targets:
        - ChineseChroniclesUITests
  ChineseChronicles:
    build:
      targets:
        ChineseChronicles: all
        ChineseChroniclesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChineseChroniclesTests
    archive:
      config: Release
  ChineseChroniclesSideload:
    build:
      targets:
        ChineseChroniclesSideload: all
    run:
      config: Debug
    archive:
      config: Release
