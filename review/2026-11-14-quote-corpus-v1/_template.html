<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鲸鱼 · 金句样张审核</title>
<style>
  :root{
    --bg:#070d14;
    --panel:rgba(18,32,44,.72);
    --panel-2:rgba(24,42,56,.86);
    --line:rgba(126,196,214,.16);
    --line-strong:rgba(126,196,214,.34);
    --text:#e9f4f7;
    --muted:#8ea7b3;
    --dim:#5f7784;
    --teal:#5fd0c7;
    --teal-soft:rgba(95,208,199,.14);
    --gold:#e6c27a;
    --red:#ef7d7d;
    --amber:#e0b25c;
    --radius:20px;
    font-synthesis:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--text);
    background:
      radial-gradient(1200px 700px at 12% -10%, rgba(45,120,140,.30), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(30,72,110,.32), transparent 55%),
      radial-gradient(700px 500px at 50% 115%, rgba(20,90,88,.22), transparent 60%),
      var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(circle at 50% 35%,#000 20%,transparent 78%);
  }
  .app{position:relative;max-width:1080px;margin:0 auto;padding:26px 22px 34px;min-height:100%}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{
    width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(145deg,rgba(95,208,199,.22),rgba(26,70,88,.5));
    border:1px solid var(--line-strong);box-shadow:0 8px 24px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .mark svg{width:26px;height:26px;display:block}
  h1{font-size:19px;margin:0 0 3px;letter-spacing:.04em;font-weight:600}
  .sub{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
  .version{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .stat{
    min-width:76px;padding:8px 12px;border-radius:13px;border:1px solid var(--line);
    background:rgba(12,24,34,.55);text-align:center;
  }
  .stat b{display:block;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px;color:var(--muted);letter-spacing:.08em}
  .stat.ok b{color:var(--teal)} .stat.no b{color:var(--red)} .stat.hold b{color:var(--amber)}

  .progress{margin-top:16px;height:5px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
  .progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),#7fe0c4);transition:width .35s ease}

  .toolbar{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .row .label{font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin-right:2px;min-width:46px}
  .chip{
    appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--muted);
    padding:6px 12px;border-radius:99px;font-size:12.5px;cursor:pointer;transition:.18s;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chip:hover{border-color:var(--line-strong);color:var(--text)}
  .chip.on{background:var(--teal-soft);border-color:rgba(95,208,199,.55);color:#bdf3ee}
  .chip .n{font-size:10.5px;opacity:.62;font-variant-numeric:tabular-nums}
  .chip.on .n{opacity:.85}
  .spacer{flex:1}
  .btn{
    appearance:none;font-family:inherit;cursor:pointer;border-radius:11px;font-size:12.5px;padding:7px 13px;
    border:1px solid var(--line-strong);background:rgba(255,255,255,.05);color:var(--text);transition:.18s;
  }
  .btn:hover{background:rgba(255,255,255,.09)}
  .btn.ghost{border-color:var(--line);color:var(--muted);background:transparent}
  .btn.ghost:hover{color:var(--text);border-color:var(--line-strong)}
  .search{
    flex:1;min-width:180px;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:11px;
    border:1px solid var(--line);background:rgba(8,18,26,.6);
  }
  .search svg{width:14px;height:14px;opacity:.5;flex:0 0 auto}
  .search input{
    flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:13px;font-family:inherit;
  }
  .search input::placeholder{color:var(--dim)}

  .select{
    appearance:none;min-width:190px;cursor:pointer;font-family:inherit;font-size:12.5px;
    border:1px solid var(--line);border-radius:10px;background:rgba(8,18,26,.6);
    color:var(--text);padding:7px 30px 7px 11px;outline:0;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M3 4.5 6 7.5 9 4.5' fill='none' stroke='%238ea7b3' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 10px center;background-size:11px;
  }
  .select:focus{border-color:rgba(95,208,199,.5)}
  .src-count{font-size:11.5px;color:var(--dim)}

  .stage{margin-top:18px}
  .card{
    position:relative;border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(160deg,rgba(31,52,66,.78),rgba(13,24,33,.84));
    box-shadow:0 26px 60px -28px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
    padding:26px 28px 22px;min-height:300px;display:flex;flex-direction:column;
    backdrop-filter:blur(14px);
  }
  .card::after{
    content:"";position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;
    background:radial-gradient(600px 220px at 18% -20%,rgba(95,208,199,.13),transparent 70%);
  }
  .meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .id{font-size:11px;letter-spacing:.16em;color:var(--dim);font-variant-numeric:tabular-nums}
  .theme{font-size:11.5px;padding:3px 9px;border-radius:99px;background:rgba(95,208,199,.12);color:#a9e7e1;border:1px solid rgba(95,208,199,.24)}
  .tone{font-size:11.5px;padding:3px 9px;border-radius:99px;background:rgba(230,194,122,.10);color:#e6c27a;border:1px solid rgba(230,194,122,.22)}
  .status{margin-left:auto;font-size:11.5px;letter-spacing:.06em;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .status.ok{color:var(--teal);border-color:rgba(95,208,199,.4);background:rgba(95,208,199,.08)}
  .status.no{color:var(--red);border-color:rgba(239,125,125,.38);background:rgba(239,125,125,.08)}
  .status.hold{color:var(--amber);border-color:rgba(224,178,92,.38);background:rgba(224,178,92,.08)}
  .quote{
    margin:26px 0 20px;font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,SimSun,serif;
    font-size:clamp(24px,3.4vw,34px);line-height:1.62;letter-spacing:.03em;font-weight:500;
    text-wrap:balance;color:#f2fafb;
  }
  .source{font-size:13px;color:var(--muted);line-height:1.7}
  .source b{color:#c8dbe2;font-weight:500}
  .source .loc{color:var(--dim);margin-left:10px}
  .actions{margin-top:auto;padding-top:22px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .act{
    appearance:none;font-family:inherit;cursor:pointer;border-radius:12px;padding:10px 18px;font-size:13.5px;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);transition:.16s;
    display:inline-flex;align-items:center;gap:7px;
  }
  .act:hover{transform:translateY(-1px)}
  .act.pass{border-color:rgba(95,208,199,.5);background:rgba(95,208,199,.16);color:#c6f6f1}
  .act.pass:hover{background:rgba(95,208,199,.26)}
  .act.fail{border-color:rgba(239,125,125,.42);background:rgba(239,125,125,.10);color:#ffc4c4}
  .act.fail:hover{background:rgba(239,125,125,.2)}
  .act.hold{border-color:rgba(224,178,92,.4);background:rgba(224,178,92,.10);color:#f2d59d}
  .act.hold:hover{background:rgba(224,178,92,.2)}
  .act kbd{font-family:inherit;font-size:10.5px;opacity:.55;border:1px solid currentColor;border-radius:5px;padding:0 4px}
  .nav{margin-left:auto;display:flex;align-items:center;gap:6px}
  .nav .count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-right:4px}
  .nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;font-size:15px}
  .nav button:hover{color:var(--text);border-color:var(--line-strong)}
  .nav button:disabled{opacity:.3;cursor:default}

  .editor{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;display:none;gap:10px;grid-template-columns:1fr 1fr}
  .editor.on{display:grid}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1/-1}
  .field label{font-size:10.5px;letter-spacing:.12em;color:var(--dim)}
  .field input,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;background:rgba(5,13,19,.7);color:var(--text);
    padding:8px 10px;font-size:13px;font-family:inherit;outline:0;resize:vertical;
  }
  .field textarea{font-family:"Songti SC","Noto Serif SC",STSong,SimSun,serif;font-size:15px;line-height:1.5}
  .field input:focus,.field textarea:focus{border-color:rgba(95,208,199,.5)}
  .editor-foot{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}

  .empty{
    min-height:300px;display:grid;place-items:center;text-align:center;color:var(--muted);
    border:1px dashed var(--line);border-radius:var(--radius);padding:30px;
  }
  .empty b{display:block;font-size:16px;color:var(--text);margin-bottom:8px}

  .themebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px}
  .tb{border:1px solid var(--line);border-radius:11px;padding:8px 9px;background:rgba(10,20,28,.45);cursor:pointer;transition:.16s;text-align:left}
  .tb:hover{border-color:var(--line-strong);background:rgba(255,255,255,.045)}
  .tb .t{font-size:11.5px;color:#cfe2e8;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
  .tb .t em{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums}
  .tb .bar{height:3px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .tb .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(95,208,199,.75),rgba(127,224,196,.9))}

  footer{margin-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  footer .hint{line-height:1.7}
  kbd{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;padding:1px 5px;border-radius:5px;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#b9cdd6;
  }
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:rgba(20,40,48,.95);border:1px solid rgba(95,208,199,.4);color:#d9fbf7;
    padding:10px 18px;border-radius:12px;font-size:13px;transition:.22s;z-index:50;box-shadow:0 16px 40px rgba(0,0,0,.5)
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:760px){
    .app{padding:18px 14px 28px}
    .card{padding:20px 18px 18px;border-radius:17px;min-height:260px}
    .themebar{grid-template-columns:repeat(3,minmax(0,1fr))}
    .editor{grid-template-columns:1fr}
    .quote{margin:20px 0 16px}
    .actions{gap:8px}
    .act{flex:1 1 calc(50% - 4px);justify-content:center;padding:10px 12px}
    .nav{margin-left:0;flex:1 0 100%;justify-content:flex-end;margin-top:2px}
    .stats{width:100%}
    .stat{flex:1;min-width:0}
    .row .label{display:none}
    .search{flex:1 0 100%}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3.2 12.4c2.1 0 3.6-1.2 4.6-2.4.8-1 1.6-2.2 2.9-2.2 1.6 0 2.3 1.4 3 2.7.7 1.3 1.5 2.6 3.1 2.6 1.4 0 2.4-.8 2.9-1.7" stroke="#7fe0d4" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M8.2 13.6c1.3 2.6 3.1 4.2 5.4 4.2 2 0 3.7-1.2 4.9-3.2" stroke="#5fd0c7" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="9.1" cy="10.1" r=".8" fill="#bdf3ee"/>
        </svg>
      </div>
      <div>
        <h1>金句样张审核</h1>
        <div class="sub">6 个主题 × 80 条 · 精选语料 v1</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-total">480</b><span>总数</span></div>
      <div class="stat ok"><b id="s-pass">0</b><span>通过</span></div>
      <div class="stat no"><b id="s-fail">0</b><span>淘汰</span></div>
      <div class="stat hold"><b id="s-hold">480</b><span>待审</span></div>
    </div>
  </header>

  <div class="progress"><i id="prog"></i></div>

  <div class="themebar" id="themebar"></div>

  <section class="toolbar">
    <div class="row" id="theme-row"><span class="label">主题</span></div>
    <div class="row" id="status-row"><span class="label">状态</span></div>
    <div class="row">
      <span class="label">出处</span>
      <select id="src" class="select" aria-label="按出处筛选"></select>
      <span class="src-count" id="src-count"></span>
    </div>
    <div class="row">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="q" type="search" aria-label="搜索正文、出处、编号" placeholder="搜索正文、出处、编号…" autocomplete="off">
      </div>
      <button class="btn" id="export-pass">导出已通过</button>
      <button class="btn ghost" id="export-all">导出全部</button>
      <button class="btn ghost" id="reset">重置</button>
    </div>
  </section>

  <main class="stage" id="stage"></main>

  <footer>
    <div class="hint">
      <kbd>←</kbd><kbd>→</kbd> 切换 &nbsp;·&nbsp; <kbd>1</kbd> 通过 &nbsp;·&nbsp; <kbd>2</kbd> 淘汰 &nbsp;·&nbsp; <kbd>0</kbd> 待定 &nbsp;·&nbsp; <kbd>E</kbd> 编辑
    </div>
    <div class="hint" id="saved">进度自动保存在本机浏览器</div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const QUOTES = __QUOTE_DATA__;
const THEMES = ["修身自省","处世智慧","心境审美","读书学习","励志进取","家国天下"];
const STATUS_LABEL = {pending:"待审", approved:"通过", rejected:"淘汰"};
const STORE_KEY = "whale-quote-review-v1";

let overrides = {};
try { overrides = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { overrides = {}; }

let filters = { theme: "全部", status: "全部", source: "全部", q: "" };
let view = [];
let cursor = 0;
let editing = false;

function merged(q) {
  const o = overrides[q.id] || {};
  return {
    id: q.id, theme: q.theme,
    text: o.text !== undefined ? o.text : q.text,
    source: o.source !== undefined ? o.source : q.source,
    locator: o.locator !== undefined ? o.locator : q.locator,
    tone: o.tone !== undefined ? o.tone : q.tone,
    status: o.status || "pending",
    edited: !!(o.text !== undefined || o.source !== undefined || o.locator !== undefined || o.tone !== undefined)
  };
}
function all() { return QUOTES.map(merged); }
function setOverride(id, patch) {
  overrides[id] = Object.assign({}, overrides[id] || {}, patch);
  persist();
}
function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(overrides));
    document.getElementById("saved").textContent = "已保存 " + new Date().toLocaleTimeString("zh-CN", {hour12:false});
  } catch (e) {
    toast("本地保存失败：" + e.message);
  }
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1900);
}

function computeView(keepId) {
  const q = filters.q.trim().toLowerCase();
  view = all().filter(x => {
    if (filters.theme !== "全部" && x.theme !== filters.theme) return false;
    if (filters.status !== "全部" && x.status !== filters.status) return false;
    if (filters.source !== "全部" && x.source !== filters.source) return false;
    if (q) {
      const hay = (x.id + x.text + x.source + x.locator + x.tone).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (keepId) {
    const i = view.findIndex(x => x.id === keepId);
    cursor = i >= 0 ? i : Math.min(cursor, Math.max(0, view.length - 1));
  } else if (cursor >= view.length) {
    cursor = Math.max(0, view.length - 1);
  }
}

function stats() {
  const list = all();
  const c = {pending:0, approved:0, rejected:0};
  list.forEach(x => c[x.status]++);
  document.getElementById("s-total").textContent = list.length;
  document.getElementById("s-pass").textContent = c.approved;
  document.getElementById("s-fail").textContent = c.rejected;
  document.getElementById("s-hold").textContent = c.pending;
  const done = c.approved + c.rejected;
  document.getElementById("prog").style.width = (list.length ? done / list.length * 100 : 0) + "%";
}

function renderThemeBar() {
  const list = all();
  const bar = document.getElementById("themebar");
  bar.innerHTML = THEMES.map(t => {
    const items = list.filter(x => x.theme === t);
    const done = items.filter(x => x.status !== "pending").length;
    const pct = items.length ? done / items.length * 100 : 0;
    return `<div class="tb" data-theme="${esc(t)}"><div class="t"><span>${esc(t)}</span><em>${done}/${items.length}</em></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join("");
  bar.querySelectorAll(".tb").forEach(el => el.addEventListener("click", () => {
    filters.theme = el.dataset.theme;
    filters.status = "全部";
    cursor = 0;
    renderChips(); computeView(); render();
    window.scrollTo({top:0, behavior:"smooth"});
  }));
}

function renderChips() {
  const list = all();
  const themeRow = document.getElementById("theme-row");
  const counts = {};
  THEMES.forEach(t => counts[t] = list.filter(x => x.theme === t).length);
  themeRow.innerHTML = '<span class="label">主题</span>' +
    ["全部"].concat(THEMES).map(t => {
      const n = t === "全部" ? list.length : counts[t];
      return `<button class="chip ${filters.theme === t ? "on" : ""}" data-t="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`;
    }).join("");
  themeRow.querySelectorAll(".chip").forEach(el => el.addEventListener("click", () => {
    filters.theme = el.dataset.t; cursor = 0; renderChips(); computeView(); render();
  }));

  const statusRow = document.getElementById("status-row");
  const c = {pending:0, approved:0, rejected:0};
  list.forEach(x => c[x.status]++);
  const defs = [["全部", list.length], ["pending", c.pending], ["approved", c.approved], ["rejected", c.rejected]];
  statusRow.innerHTML = '<span class="label">状态</span>' + defs.map(([k, n]) =>
    `<button class="chip ${filters.status === k ? "on" : ""}" data-s="${k}">${k === "全部" ? "全部" : STATUS_LABEL[k]}<span class="n">${n}</span></button>`
  ).join("");
  statusRow.querySelectorAll(".chip").forEach(el => el.addEventListener("click", () => {
    filters.status = el.dataset.s; cursor = 0; renderChips(); computeView(); render();
  }));
}

function renderSourceFilter() {
  const select = document.getElementById("src");
  const list = all();
  const counts = new Map();
  list.forEach(x => counts.set(x.source, (counts.get(x.source) || 0) + 1));
  const names = [...counts.keys()].sort((a, b) =>
    counts.get(b) - counts.get(a) || a.localeCompare(b, "zh-Hans-CN"));
  if (filters.source !== "全部" && !counts.has(filters.source)) filters.source = "全部";
  select.innerHTML = `<option value="全部">全部出处（${list.length}）</option>` +
    names.map(n => `<option value="${esc(n)}">${esc(n)}（${counts.get(n)}）</option>`).join("");
  select.value = filters.source;
  document.getElementById("src-count").textContent =
    filters.source === "全部" ? `${names.length} 个出处` : `本出处 ${counts.get(filters.source)} 条`;
}

function render() {
  stats();
  renderThemeBar();
  const stage = document.getElementById("stage");
  if (!view.length) {
    stage.innerHTML = `<div class="empty"><div><b>没有符合条件的句子</b>换个主题或状态，或者清空搜索。</div></div>`;
    return;
  }
  const item = view[cursor];
  const cls = item.status === "approved" ? "ok" : item.status === "rejected" ? "no" : "hold";
  stage.innerHTML = `
    <article class="card">
      <div class="meta">
        <span class="id">${esc(item.id)}</span>
        <span class="theme">${esc(item.theme)}</span>
        <span class="tone">${esc(item.tone)}</span>
        ${item.edited ? '<span class="tone" style="background:rgba(255,255,255,.05);color:#9fb6c0;border-color:rgba(255,255,255,.12)">已改</span>' : ''}
        <span class="status ${cls}">${STATUS_LABEL[item.status]}</span>
      </div>
      <div class="quote">${esc(item.text)}</div>
      <div class="source"><b>${esc(item.source)}</b><span class="loc">${esc(item.locator)}</span></div>

      <div class="editor ${editing ? "on" : ""}" id="editor">
        <div class="field full"><label for="f-text">正文</label><textarea id="f-text" rows="2">${esc(item.text)}</textarea></div>
        <div class="field"><label for="f-source">出处</label><input id="f-source" value="${esc(item.source)}"></div>
        <div class="field"><label for="f-locator">篇章 / 定位</label><input id="f-locator" value="${esc(item.locator)}"></div>
        <div class="field"><label for="f-tone">语气</label><input id="f-tone" value="${esc(item.tone)}"></div>
        <div class="field"><label for="f-id">编号</label><input id="f-id" value="${esc(item.id)}" disabled></div>
        <div class="editor-foot">
          <button class="btn ghost" id="cancel-edit">取消</button>
          <button class="btn" id="save-edit">保存修改</button>
        </div>
      </div>

      <div class="actions">
        <button class="act pass" data-act="approved">通过 <kbd>1</kbd></button>
        <button class="act fail" data-act="rejected">淘汰 <kbd>2</kbd></button>
        <button class="act hold" data-act="pending">待定 <kbd>0</kbd></button>
        <button class="act" id="edit-btn">编辑 <kbd>E</kbd></button>
        <div class="nav">
          <span class="count">${cursor + 1} / ${view.length}</span>
          <button id="prev" ${cursor === 0 ? "disabled" : ""} title="上一条">‹</button>
          <button id="next" ${cursor === view.length - 1 ? "disabled" : ""} title="下一条">›</button>
        </div>
      </div>
    </article>`;

  stage.querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", () => setStatus(btn.dataset.act)));
  document.getElementById("prev").addEventListener("click", () => move(-1));
  document.getElementById("next").addEventListener("click", () => move(1));
  document.getElementById("edit-btn").addEventListener("click", () => { editing = true; render(); document.getElementById("f-text").focus(); });
  document.getElementById("cancel-edit").addEventListener("click", () => { editing = false; render(); });
  document.getElementById("save-edit").addEventListener("click", saveEdit);
}

function saveEdit() {
  const item = view[cursor];
  const text = document.getElementById("f-text").value.trim();
  if (!text) { toast("正文不能为空"); return; }
  setOverride(item.id, {
    text,
    source: document.getElementById("f-source").value.trim(),
    locator: document.getElementById("f-locator").value.trim(),
    tone: document.getElementById("f-tone").value.trim()
  });
  editing = false;
  computeView(item.id);
  renderChips(); renderSourceFilter(); render();
  toast("已保存修改");
}

function setStatus(status) {
  if (!view.length) return;
  const item = view[cursor];
  setOverride(item.id, { status });
  const nextId = view[cursor + 1] ? view[cursor + 1].id : null;
  computeView(nextId || item.id);
  editing = false;
  renderChips(); render();
  toast(status === "approved" ? "已通过" : status === "rejected" ? "已淘汰" : "已标记待定");
}

function move(delta) {
  if (!view.length) return;
  cursor = Math.max(0, Math.min(view.length - 1, cursor + delta));
  editing = false;
  render();
}

function download(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

document.getElementById("export-pass").addEventListener("click", () => {
  const list = all().filter(x => x.status === "approved");
  if (!list.length) { toast("还没有通过的句子"); return; }
  download("quotes.approved.json", list.map(({id,theme,text,source,locator,tone,status}) => ({id,theme,text,source,locator,tone,status})));
  toast("已导出 " + list.length + " 条");
});
document.getElementById("export-all").addEventListener("click", () => {
  const list = all().map(({id,theme,text,source,locator,tone,status}) => ({id,theme,text,source,locator,tone,status}));
  download("quotes.reviewed.json", list);
  toast("已导出全部 " + list.length + " 条");
});
document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("确定清空所有审核状态和修改吗？此操作不可撤销。")) return;
  overrides = {};
  localStorage.removeItem(STORE_KEY);
  filters = {theme:"全部", status:"全部", source:"全部", q:""};
  document.getElementById("q").value = "";
  cursor = 0; editing = false;
  computeView(); renderChips(); renderSourceFilter(); render();
  toast("已重置");
});
document.getElementById("q").addEventListener("input", e => {
  filters.q = e.target.value; cursor = 0; computeView(); render();
});

document.getElementById("src").addEventListener("change", e => {
  filters.source = e.target.value; cursor = 0; computeView(); render(); renderSourceFilter();
});

document.addEventListener("keydown", e => {
  if (e.target && e.target.matches && e.target.matches("input,textarea")) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); move(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); move(1); }
  else if (e.key === "1") { e.preventDefault(); setStatus("approved"); }
  else if (e.key === "2") { e.preventDefault(); setStatus("rejected"); }
  else if (e.key === "0") { e.preventDefault(); setStatus("pending"); }
  else if (e.key === "e" || e.key === "E") { e.preventDefault(); editing = true; render(); document.getElementById("f-text").focus(); }
});

computeView();
renderChips();
renderSourceFilter();
render();
</script>
</body>
</html>
