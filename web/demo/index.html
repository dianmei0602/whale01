<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111815">
  <title>华章 · iPhone 交互演示</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="demo-stage">
    <aside class="demo-notes">
      <div class="demo-wordmark">
        <span class="demo-seal" aria-hidden="true">华</span>
        <span>华章 · HTML 原型</span>
      </div>

      <h2 class="demo-hero-title">时间里的中国</h2>
      <p class="demo-lead">这是“长河”主界面的可交互演示。时间轴不是装饰，它同时承担浏览、比较和进入事件详情三种操作。</p>

      <div class="demo-gestures">
        <p>选择时代，再拖动年代尺。</p>
        <p>点击政权条进入卷页，点击事件进入正文。</p>
        <p>右上角的“夜读”会切换整套阅读模式。</p>
      </div>

      <dl class="demo-facts">
        <div><dt>当前界面</dt><dd id="route-readout">长河</dd></div>
        <div><dt>资料版本</dt><dd id="content-version">载入中</dd></div>
        <div><dt>数据范围</dt><dd>23 个政权条目 · 34 个事件 · 19 个出处</dd></div>
      </dl>

      <a class="back-link" href="../../index.html">返回项目首页</a>
    </aside>

    <main class="device-stage">
      <div class="device" data-ui>
        <div class="device-screen">
          <div class="status-bar" aria-hidden="true">
            <span>9:41</span>
            <span class="status-icons">5G　▮▮▮</span>
          </div>

          <header class="app-header" id="app-header"></header>
          <main class="app-content" id="app-content" tabindex="-1"></main>

          <nav class="app-tabs" id="app-tabs" aria-label="主要导航">
            <a href="#/river" data-view="river">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M5 14l4-5 4 2 6-7"/></svg>
              <span>长河</span>
            </a>
            <a href="#/catalog" data-view="catalog">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M9 7h10M9 12h10M9 17h10"/></svg>
              <span>卷目</span>
            </a>
            <a href="#/atlas" data-view="atlas">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
              <span>并立</span>
            </a>
            <a href="#/search" data-view="search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>
              <span>索引</span>
            </a>
          </nav>

          <div class="home-indicator" aria-hidden="true"></div>
          <div class="app-toast" id="app-toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </main>
  </div>

  <noscript>
    <p class="noscript">此演示需要 JavaScript 才能切换时间轴和打开详情。</p>
  </noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
