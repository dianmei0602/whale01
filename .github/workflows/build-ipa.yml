name: build-ipa

on:
  push:
    branches: [shanhe-zhanyi-ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj || true

      - name: Build unsigned
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -target App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -120

      - name: Failure summary
        if: failure()
        run: |
          cd ios/App
          {
            echo "## build failed"
            echo '```'
            grep -E "error:|fatal error:" build.log | head -40 || tail -80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA
        run: |
          cd ios/App
          rm -rf Payload ShanheZhanyi-unsigned.ipa
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/App.app" Payload/
          zip -qry ShanheZhanyi-unsigned.ipa Payload
          ls -lh ShanheZhanyi-unsigned.ipa
          unzip -l ShanheZhanyi-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShanheZhanyi-unsigned-ipa
          path: ios/App/ShanheZhanyi-unsigned.ipa
          if-no-files-found: error
