name: Push Quick Validation
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'interaction' && 'Manual iOS interaction regression' || 'Push quick validation' }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Quick compile, unit tests, palette screenshots, appearance, assistant desktop, UI-only regression, or full regression
        type: choice
        options: [quick, units, palette, appearance, assistant, ui, interaction]
        default: quick
  push:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - "backend/**"
      - "!backend/**/*.md"
      - "tools/build_identity.py"
      - "tools/release_identity.py"
      - "tools/test_release_identity.py"
      - "tools/test_whale_chat_layout.swift"
      - "tools/test_voice_overlay_state.swift"
      - "tools/test_home_landing_state.swift"
      - "tools/test_chat_header_state.swift"
      - "tools/test_workspace_hub_state.swift"
      - "README.md"
      - "CHANGELOG.md"
      - "00_执行看板.md"
      - "docs/README.md"
      - "docs/logs/**"
      - "docs/superpowers/plans/**"
      - ".github/workflows/fork-ios-sideload-ipa.yml"
      - ".github/workflows/ios-*.yml"
  pull_request:
    paths:
      - "ios/**"
      - "!ios/**/*.md"
      - "backend/**"
      - "!backend/**/*.md"
      - "tools/build_identity.py"
      - "tools/release_identity.py"
      - "tools/test_release_identity.py"
      - "tools/test_whale_chat_layout.swift"
      - "tools/test_voice_overlay_state.swift"
      - "tools/test_home_landing_state.swift"
      - "tools/test_chat_header_state.swift"
      - "tools/test_workspace_hub_state.swift"
      - "README.md"
      - "CHANGELOG.md"
      - "00_执行看板.md"
      - "docs/README.md"
      - "docs/logs/**"
      - "docs/superpowers/plans/**"
      - ".github/workflows/fork-ios-sideload-ipa.yml"
      - ".github/workflows/ios-*.yml"

permissions:
  contents: read

concurrency:
  group: whale-validation-${{ inputs.scope || 'quick' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'quick' }}
    name: Backend fixture regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run release identity contract
        run: python -m unittest tools.test_release_identity -v
      - name: Run controlled backend tests
        working-directory: backend
        run: npm test

  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'quick' }}
    name: Compile app and test targets without simulator boot
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run chat layout contract
        run: |
          swiftc \
            ios/WhaleAgent/Models/WhaleChatMessageLayout.swift \
            tools/test_whale_chat_layout.swift \
            -o /tmp/whale-chat-layout-test
          /tmp/whale-chat-layout-test
      - name: Run voice overlay state contract
        run: |
          swiftc \
            ios/WhaleAgent/Models/WhaleVoiceOverlayPresentation.swift \
            tools/test_voice_overlay_state.swift \
            -o /tmp/voice-overlay-state-test
          /tmp/voice-overlay-state-test
      - name: Run home landing state contract
        run: |
          swiftc \
            ios/WhaleAgent/Models/ConversationEntryMode.swift \
            tools/test_home_landing_state.swift \
            -o /tmp/home-landing-state-test
          /tmp/home-landing-state-test
      - name: Run chat header state contract
        run: |
          swiftc \
            ios/WhaleAgent/Models/WhaleChatHeaderPresentation.swift \
            tools/test_chat_header_state.swift \
            -o /tmp/chat-header-state-test
          /tmp/chat-header-state-test
      - name: Run workspace hub state contract
        run: |
          swiftc \
            ios/WhaleAgent/Models/WhaleWorkspaceHubMode.swift \
            tools/test_workspace_hub_state.swift \
            -o /tmp/workspace-hub-state-test
          /tmp/workspace-hub-state-test
      - name: Validate release identity
        run: python3 tools/release_identity.py --check --github-env
      - name: Generate source identity
        run: python3 tools/build_identity.py
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile app and both test bundles
        working-directory: ios
        run: |
          set -euo pipefail
          for SCHEME in WhaleAgent WhaleAgentInteractions; do
            xcodebuild \
              -project WhaleAgent.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              MARKETING_VERSION="$WHALE_MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$WHALE_BUILD_BASE.${{ github.run_attempt }}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build-for-testing | tee -a compile.log
          done
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-quick-compile-log
          path: ios/compile.log
          retention-days: 7
          if-no-files-found: warn

  interaction:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'interaction' }}
    name: Manually requested full regression
    uses: ./.github/workflows/ios-ui-tests.yml

  units:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'units' }}
    name: Unit test regression
    uses: ./.github/workflows/ios-ui-tests.yml
    with:
      scope: units

  ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'ui' }}
    name: Manually requested UI regression
    uses: ./.github/workflows/ios-ui-tests.yml
    with:
      scope: ui

  appearance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'appearance' }}
    name: Appearance switching regression
    uses: ./.github/workflows/ios-ui-tests.yml
    with:
      scope: appearance

  assistant:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'assistant' }}
    name: Assistant desktop regression
    uses: ./.github/workflows/ios-ui-tests.yml
    with:
      scope: assistant

  palette:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'palette' }}
    name: Capture Night Sea and Gilded appearance
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate release identity
        run: python3 tools/release_identity.py --check --github-env
      - name: Generate source identity
        run: python3 tools/build_identity.py
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build simulator app
        working-directory: ios
        run: |
          xcodebuild \
            -project WhaleAgent.xcodeproj \
            -scheme WhaleAgent \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            MARKETING_VERSION="$WHALE_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$WHALE_BUILD_BASE.${{ github.run_attempt }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Capture palette screenshots
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for rt in d.values() for x in rt if x["name"].startswith("iPhone")]; c.sort(key=lambda x: x["name"] != "iPhone 16 Pro"); print(c[0]["udid"] if c else "")')
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" ios/build/Build/Products/Debug-iphonesimulator/WhaleAgent.app
          mkdir -p palette-snapshots
          for palette in gilded nightSea; do
            SIMCTL_CHILD_WHALE_DEMO_HOME=1 \
            SIMCTL_CHILD_WHALE_DEMO_PALETTE="$palette" \
            SIMCTL_CHILD_WHALE_DEMO_CONTEXT=1 \
              xcrun simctl launch "$DEVICE_ID" com.whale01.agent
            sleep 6
            xcrun simctl io "$DEVICE_ID" screenshot "palette-snapshots/home-${palette}.png"
            xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
            SIMCTL_CHILD_WHALE_DEMO_SETTINGS=1 \
            SIMCTL_CHILD_WHALE_DEMO_PALETTE="$palette" \
              xcrun simctl launch "$DEVICE_ID" com.whale01.agent
            sleep 4
            xcrun simctl io "$DEVICE_ID" screenshot "palette-snapshots/appearance-${palette}.png"
            xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
            SIMCTL_CHILD_WHALE_DEMO_HOME=1 \
            SIMCTL_CHILD_WHALE_DEMO_PALETTE="$palette" \
            SIMCTL_CHILD_WHALE_DEMO_PREVIEW=1 \
              xcrun simctl launch "$DEVICE_ID" com.whale01.agent
            sleep 5
            xcrun simctl io "$DEVICE_ID" screenshot "palette-snapshots/preview-${palette}.png"
            xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
            xcrun simctl ui "$DEVICE_ID" appearance dark
            SIMCTL_CHILD_WHALE_DEMO_HOME=1 \
            SIMCTL_CHILD_WHALE_DEMO_PALETTE="$palette" \
            SIMCTL_CHILD_WHALE_DEMO_CONTEXT=1 \
              xcrun simctl launch "$DEVICE_ID" com.whale01.agent
            sleep 6
            xcrun simctl io "$DEVICE_ID" screenshot "palette-snapshots/home-${palette}-dark.png"
            xcrun simctl terminate "$DEVICE_ID" com.whale01.agent || true
            xcrun simctl ui "$DEVICE_ID" appearance light
          done
          xcrun simctl spawn "$DEVICE_ID" log show --last 12m --style compact \
            --predicate 'process == "WhaleAgent" OR eventMessage CONTAINS "WhaleAgent"' \
            > palette-snapshots/simulator-WhaleAgent.log || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'WhaleAgent*' -mmin -15 \
            -exec cp {} palette-snapshots/ \; || true
      - name: Upload palette screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-palette-screenshots
          path: palette-snapshots
          if-no-files-found: warn
