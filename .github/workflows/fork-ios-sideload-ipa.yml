name: Fork iOS Sideload IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build from source or inject Xunfei into the verified IPA
        type: choice
        options: [repackage, build]
        default: repackage
      artifact_id:
        description: Verified unsigned IPA artifact for repackage mode
        required: true
        default: "14170511404"

permissions:
  actions: read
  contents: read

concurrency:
  group: fork-ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ inputs.mode != 'repackage' }}
    name: Build unsigned device IPA for AltStore / SideStore
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Xunfei credentials
        env:
          XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
        run: python3 tools/inject_xfyun_credentials.py ios/WhaleAgent/Info.plist

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate source identity
        run: python3 tools/build_identity.py

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Boot iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; c=[x for rt in json.load(sys.stdin)["devices"].values() for x in rt if x["name"].startswith("iPhone")]; c.sort(key=lambda x: x["name"] != "iPhone 16 Pro"); print(c[0]["udid"] if c else "")')
          test -n "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WhaleAgent.xcodeproj \
            -scheme WhaleAgent \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test | tee unit-tests.log

      - name: Archive without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WhaleAgent.xcodeproj \
            -scheme WhaleAgentSideload \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/WhaleAgent.xcarchive \
            MARKETING_VERSION=2.0.0 \
            CURRENT_PROJECT_VERSION="200.${{ github.run_attempt }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="$(ls -d build/WhaleAgent.xcarchive/Products/Applications/*.app | head -1)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry WhaleAgent-Sideload.ipa Payload
          unzip -l WhaleAgent-Sideload.ipa | head -20

      - name: Verify candidate identity
        run: python3 tools/verify_ipa.py ios/build/WhaleAgent-Sideload.ipa --sha "$GITHUB_SHA" --require-xfyun

      - name: Encrypt IPA for public storage
        working-directory: ios
        run: |
          set -e
          PASS_FILE="$(mktemp)"
          openssl rand -hex 32 > "$PASS_FILE"
          openssl enc -aes-256-cbc -pbkdf2 -salt -md sha256 \
            -in build/WhaleAgent-Sideload.ipa \
            -out build/WhaleAgent-Sideload.ipa.enc \
            -pass "file:$PASS_FILE"
          openssl rsautl -encrypt -pubin -inkey ../.github/xfyun-ipa-public.pem -pkcs \
            -in "$PASS_FILE" \
            -out build/WhaleAgent-pass.enc
          rm -f "$PASS_FILE"
          shasum -a 256 build/WhaleAgent-Sideload.ipa > build/WhaleAgent-Sideload.sha256
          ls -l build/WhaleAgent-Sideload.ipa.enc build/WhaleAgent-pass.enc

      - name: Verify binary architectures
        working-directory: ios
        run: |
          lipo -info build/Payload/WhaleAgent.app/WhaleAgent

      - name: Upload encrypted IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhaleAgent-Xfyun-ipa-enc
          path: |
            ios/build/WhaleAgent-Sideload.ipa.enc
            ios/build/WhaleAgent-pass.enc
            ios/build/WhaleAgent-Sideload.sha256
            ios/build/WhaleAgent-Sideload.manifest.json

      - name: Show build identity
        working-directory: ios
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Payload/WhaleAgent.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Payload/WhaleAgent.app/Info.plist

  repackage:
    if: ${{ inputs.mode == 'repackage' }}
    name: Repackage verified IPA with Xunfei credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download verified unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o source-artifact.zip
          mkdir -p repackage
          unzip -q source-artifact.zip -d repackage

      - name: Inject credentials and verify
        env:
          XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
        run: |
          set -euo pipefail
          IPA="$(find repackage -type f -name 'WhaleAgent-Sideload.ipa' | head -1)"
          test -n "$IPA"
          SOURCE_MANIFEST="$(find repackage -type f -name 'WhaleAgent-Sideload.manifest.json' | head -1)"
          test -n "$SOURCE_MANIFEST"
          SOURCE_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["gitSHA"])' "$SOURCE_MANIFEST")"
          WORK="$(mktemp -d)"
          unzip -q "$IPA" -d "$WORK"
          INFO="$WORK/Payload/WhaleAgent.app/Info.plist"
          python3 tools/inject_xfyun_credentials.py "$INFO"
          (
            cd "$WORK"
            zip -qry xfyun.ipa Payload
          )
          cp "$WORK/xfyun.ipa" repackage/WhaleAgent-Xfyun.ipa
          python3 tools/verify_ipa.py \
            repackage/WhaleAgent-Xfyun.ipa \
            --sha "$SOURCE_SHA" \
            --require-xfyun

      - name: Encrypt repackaged IPA
        run: |
          set -euo pipefail
          PASS_FILE="$(mktemp)"
          openssl rand -hex 32 > "$PASS_FILE"
          openssl enc -aes-256-cbc -pbkdf2 -salt -md sha256 \
            -in repackage/WhaleAgent-Xfyun.ipa \
            -out repackage/WhaleAgent-Xfyun.ipa.enc \
            -pass "file:$PASS_FILE"
          openssl rsautl -encrypt -pubin -inkey .github/xfyun-ipa-public.pem -pkcs \
            -in "$PASS_FILE" \
            -out repackage/WhaleAgent-Xfyun-pass.enc
          rm -f "$PASS_FILE"
          sha256sum repackage/WhaleAgent-Xfyun.ipa > repackage/WhaleAgent-Xfyun.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WhaleAgent-Xfyun-repackaged-enc
          path: |
            repackage/WhaleAgent-Xfyun.ipa.enc
            repackage/WhaleAgent-Xfyun-pass.enc
            repackage/WhaleAgent-Xfyun.sha256
            repackage/WhaleAgent-Xfyun.manifest.json
