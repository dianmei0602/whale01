name: Chinese Chronicles Sideload

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch in the public fork containing ChineseChronicles
        required: true
        default: chinese-chronicles-ci
        type: string

permissions:
  contents: read

concurrency:
  group: chinese-chronicles-ipa-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build verified side-load IPA
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Resolve exact source identity
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate bundled chronicle corpus
        run: node tools/validate_chronicles.mjs --check

      - name: Generate source identity
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}
        run: python3 tools/build_identity.py

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ChineseChronicles.xcodeproj \
            -scheme ChineseChroniclesSideload \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ChineseChronicles.xcarchive \
            MARKETING_VERSION=0.1.0 \
            CURRENT_PROJECT_VERSION="1.${{ github.run_attempt }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="$(ls -d build/ChineseChronicles.xcarchive/Products/Applications/*.app | head -1)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry ChineseChronicles-Sideload.ipa Payload
          unzip -l ChineseChronicles-Sideload.ipa | head -20

      - name: Verify candidate identity
        run: |
          python3 tools/verify_ipa.py \
            ios/build/ChineseChronicles-Sideload.ipa \
            --sha "${{ steps.source.outputs.sha }}" \
            --public

      - name: Encrypt IPA for public storage
        working-directory: ios
        run: |
          set -e
          PASS_FILE="$(mktemp)"
          openssl rand -hex 32 > "$PASS_FILE"
          openssl enc -aes-256-cbc -pbkdf2 -salt -md sha256 \
            -in build/ChineseChronicles-Sideload.ipa \
            -out build/ChineseChronicles-Sideload.ipa.enc \
            -pass "file:$PASS_FILE"
          openssl rsautl -encrypt -pubin -inkey ../.github/ipa-public.pem -pkcs \
            -in "$PASS_FILE" \
            -out build/ChineseChronicles-Sideload-pass.enc
          rm -f "$PASS_FILE"
          shasum -a 256 build/ChineseChronicles-Sideload.ipa \
            > build/ChineseChronicles-Sideload.sha256
          ls -l \
            build/ChineseChronicles-Sideload.ipa.enc \
            build/ChineseChronicles-Sideload-pass.enc

      - name: Verify binary architectures
        working-directory: ios
        run: lipo -info build/Payload/ChineseChronicles.app/ChineseChronicles

      - name: Upload encrypted IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChineseChronicles-Sideload-ipa-enc
          retention-days: 14
          path: |
            ios/build/ChineseChronicles-Sideload.ipa.enc
            ios/build/ChineseChronicles-Sideload-pass.enc
            ios/build/ChineseChronicles-Sideload.sha256
            ios/build/ChineseChronicles-Sideload.manifest.json

      - name: Upload direct unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChineseChronicles-Sideload-ipa-direct
          retention-days: 3
          path: |
            ios/build/ChineseChronicles-Sideload.ipa
            ios/build/ChineseChronicles-Sideload.sha256
            ios/build/ChineseChronicles-Sideload.manifest.json

      - name: Show build identity
        working-directory: ios
        run: |
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            build/Payload/ChineseChronicles.app/Info.plist
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            build/Payload/ChineseChronicles.app/Info.plist
