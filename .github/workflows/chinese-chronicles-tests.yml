name: Chinese Chronicles Interaction Tests

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch in the public fork containing ChineseChronicles
        required: true
        default: chinese-chronicles-ci
        type: string

permissions:
  contents: read

concurrency:
  group: chinese-chronicles-tests-${{ inputs.source_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Chinese Chronicles native and UI regression
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Resolve exact source identity
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate bundled chronicle corpus
        run: |
          node tools/apply_content_expansion.mjs --check
          node tools/validate_chronicles.mjs --check
          node tools/build_web_demo.mjs --check

      - name: Generate source identity
        run: env -u GITHUB_SHA python3 tools/build_identity.py

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Boot iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c 'import json,sys; c=[x for rt in json.load(sys.stdin)["devices"].values() for x in rt if x["name"].startswith("iPhone")]; c.sort(key=lambda x: x["name"] != "iPhone 16 Pro"); print(c[0]["udid"] if c else "")')
          test -n "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run native unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ChineseChronicles.xcodeproj \
            -scheme ChineseChronicles \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee test.log

      - name: Run UI tests
        if: ${{ !cancelled() }}
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ChineseChronicles.xcodeproj \
            -scheme ChineseChroniclesInteractions \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            -derivedDataPath build \
            -resultBundlePath build/InteractionResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee interaction-test.log

      - name: Export test screenshots
        if: always()
        working-directory: ios
        run: |
          if [ -d build/InteractionResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/InteractionResults.xcresult \
              --output-path build/interaction-attachments
          fi

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-chronicles-interaction-results
          retention-days: 14
          path: |
            ios/test.log
            ios/interaction-test.log
            ios/build/interaction-attachments
          if-no-files-found: warn

