name: Build Daming Atlas IPA

on:
  push:
    branches:
      - daming-atlas-build
    paths:
      - "DamingAtlasNative/**"
      - ".github/workflows/build-daming-atlas-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject TTS default configuration
        id: tts_config
        env:
          XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
        run: |
          configured=0
          for value in "$XFYUN_APP_ID" "$XFYUN_API_KEY" "$XFYUN_API_SECRET"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "bundled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$configured" -ne 3 ]; then
            echo "Only some iFlytek secrets are configured." >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const config = {
            appId: process.env.XFYUN_APP_ID,
            apiKey: process.env.XFYUN_API_KEY,
            apiSecret: process.env.XFYUN_API_SECRET,
            endpoint: 'wss://tts-api.xfyun.cn/v2/tts',
            voice: 'x4_yezi'
          };
          fs.writeFileSync(
            'DamingAtlasNative/DamingAtlasWeb/audio-config.js',
            `window.DAM_TTS_DEFAULT_CONFIG = ${JSON.stringify(config)};\n`
          );
          NODE
          echo "bundled=true" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        working-directory: DamingAtlasNative
        run: xcodegen generate

      - name: Build device app without signing
        working-directory: DamingAtlasNative
        run: |
          xcodebuild \
            -project DamingAtlas.xcodeproj \
            -scheme DamingAtlas \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: DamingAtlasNative
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "Packaging $APP_PATH"
          test -f "$APP_PATH/content-bundle.json"
          test -f "$APP_PATH/zhu_yuanzhang.png"
          test -f "$APP_PATH/DamingAtlasWeb/index.html"
          test -f "$APP_PATH/DamingAtlasWeb/content-bundle.js"
          test -f "$APP_PATH/DamingAtlasWeb/audio-experience.js"
          test -s "$APP_PATH/DamingAtlasWeb/audio-config.js"
          test -f "$APP_PATH/DamingAtlasWeb/assets/portraits/zhu_yuanzhang.png"
          test -f "$APP_PATH/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/DamingAtlas.app
          test -f ipa/Payload/DamingAtlas.app/DamingAtlas
          cd ipa
          zip -qry ../DamingAtlas-0.3.2-unsigned.ipa Payload
          cd ..
          shasum -a 256 DamingAtlas-0.3.2-unsigned.ipa > DamingAtlas-0.3.2-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DamingAtlas-unsigned-${{ github.run_number }}
          path: |
            DamingAtlasNative/DamingAtlas-0.3.2-unsigned.ipa
            DamingAtlasNative/DamingAtlas-0.3.2-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish download release
        if: steps.tts_config.outputs.bundled != 'true'
        working-directory: DamingAtlasNative
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: daming-atlas-ipa-${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            DamingAtlas-0.3.2-unsigned.ipa \
            DamingAtlas-0.3.2-unsigned.ipa.sha256 \
            --title "大明王朝 IPA #${GITHUB_RUN_NUMBER}" \
            --notes "自动构建的未签名 iOS 真机包。请使用 Sideloadly、AltStore 或 Xcode 以你的 Apple ID 重新签名后安装。讯飞密钥不包含在 IPA 中。"
