<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Nomi · 设置</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0e1013;display:flex;justify-content:center;align-items:flex-start;padding:24px;
  background-image:radial-gradient(1200px 700px at 50% -10%,#24303f 0%,#14171c 45%,#0b0d10 100%)}
.bezel{width:390px;height:844px;border-radius:56px;padding:10px;
  background:linear-gradient(160deg,#3a3d44,#15171b 40%,#0c0d10 70%,#2a2d33);
  box-shadow:0 40px 90px rgba(0,0,0,.75),inset 0 0 0 1.5px rgba(255,255,255,.10),inset 0 0 0 6px #0a0b0d}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;
  background:#12161c;display:flex;flex-direction:column;
  background-image:radial-gradient(760px 520px at 50% -14%,#212a36 0%,#181c23 52%,#12161c 100%)}
.statusbar{height:52px;padding:16px 28px 0 32px;display:flex;justify-content:space-between;
  color:#e9f1ff;font-size:15px;font-weight:600}
.statusbar i{display:inline-block;width:22px;height:11px;background:currentColor;border-radius:2px;margin-left:5px}

.topbar{display:flex;align-items:center;gap:10px;padding:6px 16px 0}
.avatar{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;
  justify-content:center;gap:5px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.avatar span{width:3.5px;height:11px;border-radius:99px;background:#1f8fdb}
.topname{font-size:16px;font-weight:600;color:#e9f1ff}
.topsub{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#9bb2cd;margin-top:2px}
.topsub i{width:6px;height:6px;border-radius:50%;background:#3be0b0;display:block}
.initial{margin-left:auto;padding:7px 14px;border-radius:999px;background:#1c2430;color:#5cb9d9;
  font-size:15px;font-weight:600}

.bigtitle{font-size:32px;font-weight:700;color:#e9f1ff;padding:14px 16px 10px;letter-spacing:-.5px}

.scroll{flex:1;overflow:auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:14px}
.card{background:rgba(30,37,46,.92);border:1px solid rgba(140,190,255,.12);border-radius:16px;
  box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.card.pad{padding:16px}

.user .name{font-size:20px;font-weight:700;color:#e9f1ff}
.user .sub{font-size:13px;color:#9bb2cd;margin-top:5px}

.row{display:flex;align-items:center;gap:12px;padding:11px 14px}
.row + .row{border-top:1px solid rgba(140,190,255,.10)}
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:600}
.t-main{flex:1;min-width:0}
.t-title{font-size:15.5px;font-weight:500;color:#e9f1ff}
.t-sub{font-size:12.5px;color:#9bb2cd;margin-top:2px}
.chev{color:#6f89a8;font-size:13px;font-weight:600}

.sw{width:51px;height:31px;border-radius:99px;background:rgba(255,255,255,.16);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:#3be0b0}
.sw.on::after{transform:translateX(20px)}
.home-ind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;
  border-radius:3px;background:#f2f3f5;opacity:.7}
</style>
</head>
<body>
<div class="bezel"><div class="screen">
  <div class="statusbar"><span>9:41</span><span><i></i><i style="width:15px;border-radius:50%"></i><i></i></span></div>

  <div class="topbar">
    <div class="avatar"><span></span><span></span></div>
    <div>
      <div class="topname">Nomi</div>
      <div class="topsub"><i></i>在线 · 正在陪着你</div>
    </div>
    <div class="initial">完成</div>
  </div>

  <div class="bigtitle">设置</div>

  <div class="scroll">
    <div class="card pad user">
      <div class="name">林</div>
      <div class="sub">Nomi 已了解 18 条记录，全部保存在本机。</div>
    </div>

    <div class="card">
      <div class="row">
        <div class="tile" style="background:rgba(240,136,58,.16);color:#f0883a">♪</div>
        <div class="t-main">
          <div class="t-title">声音</div>
          <div class="t-sub">回答时朗读，使用叶子音色</div>
        </div>
        <div class="sw"></div>
      </div>
      <div class="row">
        <div class="tile" style="background:rgba(59,224,176,.16);color:#3be0b0">🔔</div>
        <div class="t-main">
          <div class="t-title">主动提醒</div>
          <div class="t-sub">每天最多 3 条，不抢你的事</div>
        </div>
        <div class="sw on"></div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="tile" style="background:rgba(90,115,148,.18);color:#8fa6c4">🛡</div>
        <div class="t-main">
          <div class="t-title">隐私与数据</div>
          <div class="t-sub">查看哪些内容会发给模型</div>
        </div>
        <div class="chev">›</div>
      </div>
      <div class="row">
        <div class="tile" style="background:rgba(140,108,217,.18);color:#a58af0">🧠</div>
        <div class="t-main">
          <div class="t-title">记忆</div>
          <div class="t-sub">18 条，可逐条查看和删除</div>
        </div>
        <div class="chev">›</div>
      </div>
      <div class="row">
        <div class="tile" style="background:rgba(107,120,140,.18);color:#98a8bd">⚙</div>
        <div class="t-main">
          <div class="t-title">系统权限</div>
          <div class="t-sub">相机、日历、位置和通知</div>
        </div>
        <div class="chev">›</div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="tile" style="background:rgba(107,120,140,.18);color:#98a8bd">≡</div>
        <div class="t-main">
          <div class="t-title">高级</div>
          <div class="t-sub">API Key、位置、提醒时间、外观</div>
        </div>
        <div class="chev">›</div>
      </div>
    </div>
  </div>

  <div class="home-ind"></div>
</div></div>
</body>
</html>
